<!DOCTYPE html>
<html lang="de" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Familien Tagebuch</title>
    
    <!-- Apple Touch Icon für den Home-Bildschirm -->
    <link rel="apple-touch-icon" href="icon.jpg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488' },
                        dark: { bg: '#0f172a', card: '#1e293b', border: '#334155' }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            padding-top: env(safe-area-inset-top); 
            padding-bottom: env(safe-area-inset-bottom); 
            -webkit-tap-highlight-color: transparent; 
        }
        input, textarea, select { font-size: 16px !important; } /* Verhindert Auto-Zoom in iOS Safari */
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
        .dark .glass-header { background: rgba(30, 41, 59, 0.85); border-bottom: 1px solid #334155; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-dark-bg dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-14 left-1/2 -translate-x-1/2 bg-gray-800 text-white dark:bg-white dark:text-gray-900 px-5 py-3 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50 transform -translate-y-4 text-sm font-medium whitespace-nowrap">
        <span id="toast-msg"></span>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-30 glass-header px-4 py-3 flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-brand-500 to-blue-500">Daybook</h1>
        <div class="flex items-center gap-3">
            <button onclick="exportICS()" class="p-2 rounded-full bg-brand-50 dark:bg-dark-card text-brand-600 dark:text-brand-500 shadow-sm" aria-label="Exportieren">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            </button>
            <button onclick="toggleDarkMode()" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 shadow-sm" aria-label="Dark Mode">
                <span id="theme-icon" class="text-lg">🌙</span>
            </button>
        </div>
    </header>

    <!-- Main Content: Wochenansicht -->
    <main class="flex-1 px-4 py-6 max-w-md mx-auto w-full flex flex-col pb-24">
        <div class="flex justify-between items-center mb-6">
            <button onclick="changeWeek(-1)" class="p-2 bg-white dark:bg-dark-card rounded-xl shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <h2 id="current-month" class="text-lg font-bold capitalize">Monat</h2>
            <button onclick="changeWeek(1)" class="p-2 bg-white dark:bg-dark-card rounded-xl shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>

        <div id="week-container" class="flex flex-col gap-4">
            <!-- Wochentage werden hier generiert -->
        </div>
    </main>

    <!-- Flow Modal (Abend-Eintrag) -->
    <div id="flow-modal" class="fixed inset-0 z-40 hidden bg-gray-100 dark:bg-dark-bg flex-col">
        <div class="glass-header px-4 py-3 flex justify-between items-center safe-top">
            <span id="flow-date-display" class="font-bold text-gray-500 dark:text-gray-400"></span>
            <button onclick="closeFlow()" class="text-brand-500 font-medium">Abbrechen</button>
        </div>
        
        <!-- Progress Bar -->
        <div class="h-1 bg-gray-200 dark:bg-gray-700 w-full">
            <div id="progress-bar" class="h-1 bg-brand-500 transition-all duration-300 w-1/5"></div>
        </div>

        <div class="flex-1 overflow-y-auto px-4 py-6 flex flex-col">
            <!-- Card Container - Feste Mindesthöhe verhindert Zusammenquetschen/Scrollen in Schritt 1 -->
            <div class="max-w-md mx-auto w-full bg-white dark:bg-dark-card rounded-3xl shadow-sm p-6 min-h-[450px] flex flex-col relative">
                
                <!-- Schritt 1: Allgemein -->
                <div id="step-1" class="flex flex-col flex-1 step-content">
                    <h2 class="text-2xl font-bold mb-6 text-center">Wie war dein Tag?</h2>
                    <div id="general-mood-container" class="grid grid-cols-4 gap-3 mb-6">
                        <!-- Emojis generiert in JS -->
                    </div>
                    <!-- Textfeld groß und ohne Scrollbalken -->
                    <textarea id="general-note" rows="5" class="w-full min-h-[150px] p-4 rounded-2xl bg-gray-50 dark:bg-gray-800 border dark:border-dark-border resize-none focus:ring-2 focus:ring-brand-500 focus:outline-none" placeholder="Notizen zum Tag..."></textarea>
                </div>

                <!-- Schritt 2, 3, 4: Stimmung Bela, Sissi, Lola -->
                <div id="step-mood" class="flex flex-col flex-1 step-content hidden">
                    <h2 class="text-2xl font-bold mb-2 text-center">Stimmung</h2>
                    <h3 id="mood-person-name" class="text-xl font-medium mb-6 text-center text-brand-500">Person</h3>
                    <div id="person-mood-container" class="grid grid-cols-2 gap-3 flex-1">
                        <!-- 8 Optionen generiert in JS -->
                    </div>
                </div>

                <!-- Schritt 5: Gesundheit -->
                <div id="step-health" class="flex flex-col flex-1 step-content hidden pb-16">
                    <h2 class="text-2xl font-bold mb-6 text-center">Gesundheit</h2>
                    <div id="health-container" class="flex flex-col gap-5 flex-1 overflow-y-auto no-scrollbar">
                        <!-- Personen Gesundheits-Toggles in JS -->
                    </div>
                    <textarea id="health-note" rows="2" class="w-full mt-5 p-4 rounded-2xl bg-gray-50 dark:bg-gray-800 border dark:border-dark-border resize-none focus:ring-2 focus:ring-brand-500 focus:outline-none" placeholder="Gesundheits-Notizen..."></textarea>
                </div>

                <!-- Footer Navigation Buttons innerhalb der Card -->
                <div class="mt-6 flex justify-between items-center pt-4 border-t dark:border-dark-border">
                    <button id="btn-skip" onclick="skipStep()" class="text-gray-400 font-medium px-2 py-2">Überspringen</button>
                    <button id="btn-next" onclick="nextStep()" class="bg-brand-500 text-white px-6 py-2.5 rounded-full font-bold shadow-md shadow-brand-500/30 transition-transform active:scale-95">Weiter ➔</button>
                </div>

            </div>
        </div>
    </div>

    <script>
        // --- Konstanten & Daten ---
        const MOODS = [
            { id: 'm8', text: 'Herausragend', emoji: '🤩' },
            { id: 'm7', text: 'Sehr gut', emoji: '😁' },
            { id: 'm6', text: 'Gut', emoji: '🙂' },
            { id: 'm5', text: 'Ok', emoji: '😐' },
            { id: 'm4', text: 'Nicht so gut', emoji: '😕' },
            { id: 'm3', text: 'Eher schlecht', emoji: '☹️' },
            { id: 'm2', text: 'Schlecht', emoji: '😫' },
            { id: 'm1', text: 'Richtig mies', emoji: '😭' }
        ];
        
        const MAIN_MOODS = ['🤩','😁','🙂','😐','😕','☹️','😫','😭']; // Für Schritt 1
        const HEALTH_OPTS = ['Gesund', 'Kränkelt', 'Krank'];
        const PERSONS = ['Bela', 'Sissi', 'Lola'];
        const HEALTH_PERSONS = ['Papa', 'Mama', 'Bela', 'Lola'];
        const SHORT_EMOJIS = { 'Bela': '👶', 'Sissi': '👩', 'Lola': '👧' };

        let currentDate = new Date();
        let entries = JSON.parse(localStorage.getItem('daybook_entries') || '{}');
        
        let flowDate = null;
        let flowStep = 1;
        let flowData = {};

        // --- Initialisierung ---
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderWeek();
            buildUI();
        });

        // --- Theme & Toaster ---
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').innerText = '☀️';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').innerText = '🌙';
            }
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.theme = 'light';
                document.getElementById('theme-icon').innerText = '🌙';
            } else {
                html.classList.add('dark');
                localStorage.theme = 'dark';
                document.getElementById('theme-icon').innerText = '☀️';
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-4');
            }, 3000);
        }

        // --- Kalender (Wochenansicht) ---
        function getMonday(d) {
            d = new Date(d);
            var day = d.getDay(), diff = d.getDate() - day + (day == 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        function changeWeek(offset) {
            currentDate.setDate(currentDate.getDate() + (offset * 7));
            renderWeek();
        }

        function renderWeek() {
            const container = document.getElementById('week-container');
            container.innerHTML = '';
            let monday = getMonday(currentDate);
            
            const monthNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
            const wochentage = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
            
            document.getElementById('current-month').innerText = `${monthNames[monday.getMonth()]} ${monday.getFullYear()}`;

            for (let i = 0; i < 7; i++) {
                let d = new Date(monday);
                d.setDate(monday.getDate() + i);
                let dateStr = d.toISOString().split('T')[0];
                let entry = entries[dateStr];
                
                let isToday = (d.toDateString() === new Date().toDateString());
                let dayName = wochentage[i];
                let dateDisplay = `${d.getDate().toString().padStart(2, '0')}.${(d.getMonth()+1).toString().padStart(2, '0')}.`;

                let mainEmoji = entry && entry.generalEmoji ? entry.generalEmoji : '⚪';
                let bEmoji = entry && entry['Bela_emoji'] ? entry['Bela_emoji'] : '➖';
                let sEmoji = entry && entry['Sissi_emoji'] ? entry['Sissi_emoji'] : '➖';
                let lEmoji = entry && entry['Lola_emoji'] ? entry['Lola_emoji'] : '➖';

                let cardHtml = `
                    <div onclick="openFlow('${dateStr}')" class="relative bg-white dark:bg-dark-card rounded-3xl p-4 shadow-sm cursor-pointer transition-transform active:scale-95 border ${isToday ? 'border-brand-500' : 'border-transparent dark:border-dark-border'}">
                        
                        <!-- Header: Wochentag & Datum -->
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold text-gray-700 dark:text-gray-200">${dayName}</span>
                            <span class="text-sm font-medium text-gray-400">${dateDisplay}</span>
                        </div>
                        
                        <!-- Main Emoji (Mitte) -->
                        <div class="flex justify-center items-center py-2">
                            <span class="text-5xl drop-shadow-sm">${mainEmoji}</span>
                        </div>

                        <!-- Footer Emojis (Bela, Sissi, Lola) -->
                        <div class="flex justify-center gap-4 mt-3 pt-3 border-t border-gray-100 dark:border-gray-700">
                            <div class="flex flex-col items-center"><span class="text-xs text-gray-400">👶</span><span class="text-lg">${bEmoji}</span></div>
                            <div class="flex flex-col items-center"><span class="text-xs text-gray-400">👩</span><span class="text-lg">${sEmoji}</span></div>
                            <div class="flex flex-col items-center"><span class="text-xs text-gray-400">👧</span><span class="text-lg">${lEmoji}</span></div>
                        </div>

                        ${entry && entry.exported ? `<div class="absolute top-4 right-16 w-2 h-2 rounded-full bg-green-400" title="Exportiert"></div>` : ''}
                    </div>
                `;
                container.innerHTML += cardHtml;
            }
        }

        // --- Flow UI Builder ---
        function buildUI() {
            // Step 1: Main Moods
            const gmc = document.getElementById('general-mood-container');
            MAIN_MOODS.forEach((em, idx) => {
                gmc.innerHTML += `<button onclick="selectGeneralEmoji('${em}')" id="g-emoji-${em}" class="text-3xl p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 transition-all border-2 border-transparent g-emoji-btn">${em}</button>`;
            });

            // Step 2-4: Person Moods (8 Optionen im 2x4 Grid)
            const pmc = document.getElementById('person-mood-container');
            MOODS.forEach(m => {
                pmc.innerHTML += `
                    <button onclick="selectPersonMood('${m.id}', '${m.emoji}', '${m.text}')" id="p-mood-${m.id}" class="flex flex-col items-center p-3 rounded-2xl bg-gray-50 dark:bg-gray-800 transition-all border-2 border-transparent p-mood-btn">
                        <span class="text-3xl mb-1">${m.emoji}</span>
                        <span class="text-xs font-semibold text-gray-600 dark:text-gray-300 text-center">${m.text}</span>
                    </button>
                `;
            });

            // Step 5: Health
            const hc = document.getElementById('health-container');
            HEALTH_PERSONS.forEach(p => {
                let optsHtml = HEALTH_OPTS.map(h => 
                    `<button onclick="selectHealth('${p}', '${h}')" id="h-btn-${p}-${h}" class="flex-1 py-2 rounded-xl text-sm font-medium transition-all bg-gray-100 dark:bg-gray-700 h-btn-${p} border-2 border-transparent">${h}</button>`
                ).join('');
                
                hc.innerHTML += `
                    <div class="flex flex-col gap-2">
                        <span class="font-bold text-gray-700 dark:text-gray-300">${p}</span>
                        <div class="flex gap-2">${optsHtml}</div>
                    </div>
                `;
            });
        }

        // --- Flow Logik ---
        function openFlow(dateStr) {
            flowDate = dateStr;
            let dArr = dateStr.split('-');
            document.getElementById('flow-date-display').innerText = `${dArr[2]}.${dArr[1]}.${dArr[0]}`;
            
            // Lade existierende Daten oder erstelle leeres Objekt
            flowData = entries[dateStr] ? JSON.parse(JSON.stringify(entries[dateStr])) : {};
            
            flowStep = 1;
            updateFlowUI();
            document.getElementById('flow-modal').classList.remove('hidden');
            document.getElementById('flow-modal').classList.add('flex');
        }

        function closeFlow() {
            document.getElementById('flow-modal').classList.add('hidden');
            document.getElementById('flow-modal').classList.remove('flex');
        }

        function updateFlowUI() {
            // Verstecke alle Steps
            document.querySelectorAll('.step-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('progress-bar').style.width = `${(flowStep / 5) * 100}%`;
            
            document.getElementById('btn-skip').innerText = "Überspringen";
            document.getElementById('btn-next').innerText = flowStep === 5 ? "Abschließen ✓" : "Weiter ➔";

            if (flowStep === 1) {
                document.getElementById('step-1').classList.remove('hidden');
                document.getElementById('general-note').value = flowData.generalNote || '';
                highlightGeneralEmoji(flowData.generalEmoji);
            } 
            else if (flowStep >= 2 && flowStep <= 4) {
                let person = PERSONS[flowStep - 2];
                document.getElementById('step-mood').classList.remove('hidden');
                document.getElementById('mood-person-name').innerText = person;
                highlightPersonMood(flowData[`${person}_moodId`]);
            }
            else if (flowStep === 5) {
                document.getElementById('step-health').classList.remove('hidden');
                document.getElementById('health-note').value = flowData.healthNote || '';
                HEALTH_PERSONS.forEach(p => highlightHealth(p, flowData[`${p}_health`]));
            }
        }

        function saveCurrentStepData() {
            if (flowStep === 1) {
                flowData.generalNote = document.getElementById('general-note').value;
            } else if (flowStep === 5) {
                flowData.healthNote = document.getElementById('health-note').value;
            }
        }

        function nextStep() {
            saveCurrentStepData();
            if (flowStep < 5) {
                flowStep++;
                updateFlowUI();
            } else {
                finishFlow();
            }
        }

        function skipStep() {
            // Speichere Nichts für den Step und gehe weiter
            if (flowStep < 5) {
                flowStep++;
                updateFlowUI();
            } else {
                finishFlow();
            }
        }

        function finishFlow() {
            saveCurrentStepData();
            
            // Wenn der Eintrag bearbeitet wurde, setze export-Status zurück
            flowData.exported = false; 

            entries[flowDate] = flowData;
            localStorage.setItem('daybook_entries', JSON.stringify(entries));
            
            closeFlow();
            renderWeek();
            showToast('Eintrag gespeichert!');
        }

        // --- Selection Highlighter ---
        function selectGeneralEmoji(em) {
            flowData.generalEmoji = em;
            highlightGeneralEmoji(em);
        }
        function highlightGeneralEmoji(em) {
            document.querySelectorAll('.g-emoji-btn').forEach(btn => {
                btn.classList.remove('border-brand-500', 'bg-brand-50');
                btn.classList.add('border-transparent');
            });
            if (em && document.getElementById(`g-emoji-${em}`)) {
                document.getElementById(`g-emoji-${em}`).classList.remove('border-transparent');
                document.getElementById(`g-emoji-${em}`).classList.add('border-brand-500', 'bg-brand-50');
            }
        }

        function selectPersonMood(id, emoji, text) {
            let person = PERSONS[flowStep - 2];
            flowData[`${person}_moodId`] = id;
            flowData[`${person}_emoji`] = emoji;
            flowData[`${person}_text`] = text;
            highlightPersonMood(id);
        }
        function highlightPersonMood(id) {
            document.querySelectorAll('.p-mood-btn').forEach(btn => {
                btn.classList.remove('border-brand-500', 'bg-brand-50');
                btn.classList.add('border-transparent');
            });
            if (id && document.getElementById(`p-mood-${id}`)) {
                document.getElementById(`p-mood-${id}`).classList.remove('border-transparent');
                document.getElementById(`p-mood-${id}`).classList.add('border-brand-500', 'bg-brand-50');
            }
        }

        function selectHealth(person, health) {
            flowData[`${person}_health`] = health;
            highlightHealth(person, health);
        }
        function highlightHealth(person, health) {
            document.querySelectorAll(`.h-btn-${person}`).forEach(btn => {
                btn.classList.remove('border-brand-500', 'bg-brand-100', 'dark:bg-brand-900', 'text-brand-700', 'dark:text-brand-300');
                btn.classList.add('border-transparent');
            });
            if (health && document.getElementById(`h-btn-${person}-${health}`)) {
                let btn = document.getElementById(`h-btn-${person}-${health}`);
                btn.classList.remove('border-transparent');
                btn.classList.add('border-brand-500', 'bg-brand-100', 'dark:bg-brand-900', 'text-brand-700', 'dark:text-brand-300');
            }
        }

        // --- ICS Kalender Export ---
        function exportICS() {
            let keys = Object.keys(entries);
            let newExportCount = 0;
            
            let icsContent = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Daybook//DE\r\n";
            
            keys.forEach(dateStr => {
                let data = entries[dateStr];
                
                // Überspringe, falls schon exportiert und seitdem nicht verändert
                if (!data.exported) {
                    newExportCount++;
                    let [y, m, d] = dateStr.split('-');
                    let dtStart = `${y}${m}${d}`;
                    
                    icsContent += "BEGIN:VEVENT\r\n";
                    icsContent += `DTSTART;VALUE=DATE:${dtStart}\r\n`;
                    icsContent += `SUMMARY:Tagebuch ${d}.${m}.${y}\r\n`;
                    
                    // Formatierung der Notizen für den Kalendereintrag (escaped line breaks \n)
                    let desc = `Allgemein: ${data.generalEmoji || ''} ${data.generalNote ? '- '+data.generalNote.replace(/\n/g, ' ') : ''}\\n\\n`;
                    desc += `Bela: ${data.Bela_emoji || '-'} (${data.Bela_text || ''})\\n`;
                    desc += `Sissi: ${data.Sissi_emoji || '-'} (${data.Sissi_text || ''})\\n`;
                    desc += `Lola: ${data.Lola_emoji || '-'} (${data.Lola_text || ''})\\n\\n`;
                    desc += `Gesundheit:\\n`;
                    desc += `Papa: ${data.Papa_health || '-'}\\n`;
                    desc += `Mama: ${data.Mama_health || '-'}\\n`;
                    desc += `Bela: ${data.Bela_health || '-'}\\n`;
                    desc += `Lola: ${data.Lola_health || '-'}\\n`;
                    if (data.healthNote) {
                        desc += `Note: ${data.healthNote.replace(/\n/g, ' ')}\\n`;
                    }
                    
                    icsContent += `DESCRIPTION:${desc}\r\n`;
                    icsContent += "END:VEVENT\r\n";
                    
                    // Markiere als exportiert
                    entries[dateStr].exported = true;
                }
            });
            
            icsContent += "END:VCALENDAR";
            
            if (newExportCount === 0) {
                showToast("Keine neuen Einträge zum Exportieren!");
                return;
            }
            
            // Speichere die Export-Markierungen im LocalStorage
            localStorage.setItem('daybook_entries', JSON.stringify(entries));
            renderWeek(); // Lade UI neu, um den grünen Punkt anzuzeigen
            
            // Generiere den Download
            let blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = `Tagebuch_Export_${new Date().toISOString().split('T')[0]}.ics`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast(`${newExportCount} Einträge erfolgreich exportiert!`);
        }
    </script>
</body>
</html>
