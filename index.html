<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f8fafc">
  <title>Familien Tagebuch</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Plus Jakarta Sans Font (Kleiderkiste-Vibe) -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            brand: { 50: '#f0f9ff', 100: '#e0f2fe', 300: '#7dd3fc', 500: '#0ea5e9', 600: '#0284c7' }
          }
        }
      }
    }
  </script>
  
  <style>
    /* iOS & Touch Optimierungen */
    html, body {
      height: 100%;
      overflow-x: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .pb-safe { padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
    .pt-safe { padding-top: calc(0.75rem + env(safe-area-inset-top)); }
    .mb-safe-bottom { margin-bottom: env(safe-area-inset-bottom); }

    /* Sanfte Glass-Karten ("Kleiderkiste" Style) */
    .glass-card {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(226, 232, 240, 0.8);
      box-shadow: 0 8px 30px -4px rgba(0, 0, 0, 0.04);
    }
    .dark .glass-card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(51, 65, 85, 0.9);
      box-shadow: 0 8px 30px -4px rgba(0, 0, 0, 0.3);
    }

    .btn-press { transition: all 0.15s ease; }
    .btn-press:active { transform: scale(0.96); }

    /* Fix für Safari Auto-Zoom */
    input[type="text"], input[type="date"], textarea {
      font-size: 16px !important;
    }

    /* Animationen */
    .fade-enter { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="flex flex-col h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-300">

  <!-- Header -->
  <header class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-md sticky top-0 z-30 border-b border-slate-200/60 dark:border-slate-800/60 pt-safe px-4 pb-3 transition-colors duration-300">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-500 to-indigo-600 flex items-center justify-center text-white shadow-md">
          <i class="fa-solid fa-book-heart text-sm"></i>
        </div>
        <div>
          <h1 class="font-bold text-base leading-tight">Familiengeschichten</h1>
          <p class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Tagebuch</p>
        </div>
      </div>
      <!-- Theme Toggle -->
      <button id="theme-toggle" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 flex items-center justify-center btn-press">
        <i id="theme-icon" class="fa-solid fa-moon text-sm"></i>
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-grow overflow-y-auto px-4 py-5 max-w-md mx-auto w-full flex flex-col relative">
    
    <!-- ================= VIEW: WOCHENANSICHT ================= -->
    <section id="view-week" class="w-full flex flex-col flex-grow fade-enter pb-24">
      
      <!-- Wochen-Navigation -->
      <div class="glass-card rounded-2xl p-2 mb-5 flex items-center justify-between">
        <button onclick="changeWeek(-1)" class="w-10 h-10 rounded-xl bg-slate-50 dark:bg-slate-800 text-slate-500 flex items-center justify-center btn-press">
          <i class="fa-solid fa-chevron-left text-sm"></i>
        </button>
        <div class="flex flex-col items-center">
          <span class="text-[10px] font-bold text-brand-500 uppercase tracking-wider">Woche</span>
          <h2 id="week-range-label" class="font-bold text-xs">11. Nov - 17. Nov 2026</h2>
        </div>
        <button onclick="changeWeek(1)" class="w-10 h-10 rounded-xl bg-slate-50 dark:bg-slate-800 text-slate-500 flex items-center justify-center btn-press">
          <i class="fa-solid fa-chevron-right text-sm"></i>
        </button>
      </div>

      <!-- Button "Heute" (falls nicht in aktueller Woche) -->
      <div id="btn-jump-today" class="hidden mb-4 text-center">
        <button onclick="jumpToToday()" class="px-4 py-1.5 rounded-full bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300 text-xs font-bold btn-press">
          Zur aktuellen Woche springen
        </button>
      </div>

      <!-- Wochen-Liste (7 Tage) -->
      <div id="week-list" class="space-y-3">
        <!-- Generiert durch JS -->
      </div>
      
    </section>

    <!-- ================= VIEW: EINTRAGEN (WIZARD) ================= -->
    <section id="view-entry" class="hidden w-full flex-col flex-grow fade-enter">
      
      <!-- Date & Abbrechen -->
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
          <input type="date" id="entry-date" onchange="switchEntryDate(this.value)" class="font-bold bg-transparent focus:outline-none cursor-pointer text-sm p-0 border-none dark:[color-scheme:dark]">
        </div>
        <button onclick="cancelEntry()" class="text-xs font-bold text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          Abbrechen
        </button>
      </div>

      <!-- Stepper Progress -->
      <div class="mb-5 px-1">
        <div class="flex justify-between text-[11px] font-bold mb-2">
          <span id="step-label" class="text-brand-600 dark:text-brand-400">Schritt 1/5</span>
          <span id="step-title-hint" class="text-slate-400">Allgemein</span>
        </div>
        <div class="w-full bg-slate-200 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
          <div id="step-progress-bar" class="bg-brand-500 h-full w-1/5 transition-all duration-300 ease-out rounded-full"></div>
        </div>
      </div>

      <!-- Steps Content Container -->
      <div class="glass-card rounded-3xl p-5 shadow-sm mb-6 flex-grow flex flex-col relative overflow-hidden">
        
        <!-- STEP 1: Papa / Eigene Stimmung -->
        <div id="step-1" class="step-content absolute inset-0 p-5 transition-opacity duration-300 overflow-y-auto">
          <div class="text-center mb-5">
            <h2 class="text-xl font-extrabold">Wie war dein Tag?</h2>
          </div>
          <div class="grid grid-cols-4 gap-2 mb-5" id="mood-grid-own"></div>
          <div>
            <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-2 pl-1">Allgemeine Tagesnotiz:</label>
            <textarea id="note-own" rows="4" placeholder="Was ist heute passiert?" class="w-full p-4 border border-slate-200 dark:border-slate-700 rounded-2xl focus:ring-2 focus:ring-brand-500 outline-none placeholder-slate-400 bg-slate-50/50 dark:bg-slate-900/50 transition-all"></textarea>
          </div>
        </div>

        <!-- STEP 2: Bela -->
        <div id="step-2" class="step-content absolute inset-0 p-5 transition-opacity duration-300 opacity-0 pointer-events-none overflow-y-auto">
          <div class="text-center mb-5">
            <h2 class="text-xl font-extrabold text-blue-500">Belas Stimmung</h2>
            <p class="text-slate-500 text-xs mt-1">Wie ging es Bela heute?</p>
          </div>
          <div class="grid grid-cols-4 gap-2" id="mood-grid-bela"></div>
        </div>

        <!-- STEP 3: Sissi -->
        <div id="step-3" class="step-content absolute inset-0 p-5 transition-opacity duration-300 opacity-0 pointer-events-none overflow-y-auto">
          <div class="text-center mb-5">
            <h2 class="text-xl font-extrabold text-pink-500">Sissis Stimmung</h2>
            <p class="text-slate-500 text-xs mt-1">Wie ging es Sissi heute?</p>
          </div>
          <div class="grid grid-cols-4 gap-2" id="mood-grid-sissi"></div>
        </div>

        <!-- STEP 4: Lola -->
        <div id="step-4" class="step-content absolute inset-0 p-5 transition-opacity duration-300 opacity-0 pointer-events-none overflow-y-auto">
          <div class="text-center mb-5">
            <h2 class="text-xl font-extrabold text-purple-500">Lolas Stimmung</h2>
            <p class="text-slate-500 text-xs mt-1">Welchen Eindruck hat Lola gemacht?</p>
          </div>
          <div class="grid grid-cols-4 gap-2" id="mood-grid-lola"></div>
        </div>

        <!-- STEP 5: Health -->
        <div id="step-5" class="step-content absolute inset-0 p-5 transition-opacity duration-300 opacity-0 pointer-events-none overflow-y-auto">
          <div class="text-center mb-4">
            <h2 class="text-xl font-extrabold text-emerald-600 dark:text-emerald-400">Gesundheit</h2>
          </div>
          
          <div class="space-y-3 mb-4" id="health-rows"></div>

          <div>
            <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-2 pl-1">Gesundheits-Notizen:</label>
            <textarea id="note-health" rows="3" placeholder="Fieber? Husten? Arztbesuch?" class="w-full p-3 border border-slate-200 dark:border-slate-700 rounded-2xl focus:ring-2 focus:ring-emerald-500 outline-none placeholder-slate-400 bg-slate-50/50 dark:bg-slate-900/50 transition-all"></textarea>
          </div>
        </div>

      </div>

      <!-- Navigation Bottom (Stepper) -->
      <div class="pb-safe flex items-center justify-between gap-3 mt-auto">
        <button id="btn-prev" onclick="navStep(-1)" class="h-12 w-12 flex items-center justify-center rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-500 btn-press opacity-0 pointer-events-none transition-opacity">
          <i class="fa-solid fa-arrow-left"></i>
        </button>

        <div class="flex flex-grow justify-end items-center gap-2">
          <button id="btn-skip" onclick="skipStep()" class="h-12 px-4 rounded-2xl text-slate-400 dark:text-slate-500 font-bold text-xs btn-press">
            Überspringen
          </button>
          <button id="btn-next" onclick="navStep(1)" class="h-12 px-6 rounded-2xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold text-sm shadow-lg btn-press flex items-center gap-2">
            <span>Weiter</span> <i class="fa-solid fa-arrow-right text-xs"></i>
          </button>
          <button id="btn-finish" onclick="saveAndFinish()" class="h-12 px-6 rounded-2xl bg-emerald-500 text-white font-bold text-sm shadow-lg shadow-emerald-500/30 btn-press hidden flex items-center gap-2">
            <i class="fa-solid fa-check"></i> <span>Abschließen</span>
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- FAB für neuen Eintrag (nur in der Wochenansicht sichtbar) -->
  <div id="fab-container" class="fixed bottom-0 left-0 right-0 p-4 pb-safe flex justify-center pointer-events-none z-40 transition-transform duration-300">
    <button onclick="startEntryForToday()" class="pointer-events-auto w-full max-w-md py-4 rounded-2xl bg-brand-500 dark:bg-brand-600 text-white font-bold text-sm shadow-xl shadow-brand-500/30 btn-press flex items-center justify-center gap-2">
      <i class="fa-solid fa-plus"></i> Heutigen Eintrag verfassen
    </button>
  </div>

  <!-- Modal Detailansicht für einen Tag -->
  <div id="day-modal" class="fixed inset-0 bg-slate-900/40 dark:bg-slate-950/80 backdrop-blur-sm z-50 flex flex-col justify-end opacity-0 pointer-events-none transition-opacity duration-300">
    <div id="day-modal-content" class="bg-white dark:bg-slate-900 rounded-t-3xl p-6 pb-safe shadow-2xl border-t border-slate-100 dark:border-slate-800 transform translate-y-full transition-transform duration-300 max-h-[85vh] overflow-y-auto w-full max-w-md mx-auto">
      <!-- Injected by JS -->
    </div>
  </div>

  <!-- Toaster Message -->
  <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 bg-slate-800 dark:bg-white text-white dark:text-slate-900 px-5 py-2.5 rounded-full shadow-xl font-bold text-xs flex items-center gap-2 transition-all duration-300 transform -translate-y-10 opacity-0 z-50 pointer-events-none">
    <i class="fa-solid fa-circle-check text-emerald-400 dark:text-emerald-500"></i> <span id="toast-msg">Gespeichert</span>
  </div>

  <!-- ================= JAVASCRIPT ================= -->
  <script>
    // --- KONFIGURATION & DATEN ---
    const STORAGE_KEY = 'tagebuch_data';
    const MOODS = [
      { id: '1', label: 'Herausragend', emoji: '🤩' },
      { id: '2', label: 'Sehr gut',     emoji: '😁' },
      { id: '3', label: 'Gut',          emoji: '🙂' },
      { id: '4', label: 'Ok',           emoji: '😐' },
      { id: '5', label: 'Nicht so gut', emoji: '😕' },
      { id: '6', label: 'Eher schlecht',emoji: '☹️' },
      { id: '7', label: 'Schlecht',     emoji: '😩' },
      { id: '8', label: 'Richtig mies', emoji: '🤬' }
    ];
    
    const HEALTH_STATES = [
      { id: 'gesund', label: 'Gesund', color: 'text-emerald-600 bg-emerald-50 border-emerald-200 dark:bg-emerald-900/30 dark:border-emerald-800' },
      { id: 'kraenkelt', label: 'Kränkelt', color: 'text-amber-600 bg-amber-50 border-amber-200 dark:bg-amber-900/30 dark:border-amber-800' },
      { id: 'krank', label: 'Krank', color: 'text-rose-600 bg-rose-50 border-rose-200 dark:bg-rose-900/30 dark:border-rose-800' }
    ];

    const PERSONS_HEALTH = [
      { id: 'papa', label: 'Papa' },
      { id: 'mama', label: 'Mama' },
      { id: 'bela', label: 'Bela' },
      { id: 'lola', label: 'Lola' }
    ];

    // --- STATE ---
    let appData = {};
    let viewWeekStartDate = new Date(); // Hält immer den Montag der aktuell angezeigten Woche
    let currentStep = 1;
    let editingDateStr = '';
    
    // Temporärer State für den aktuellen Eintrag im Flow
    let currentEntry = {
      mood_own: null, mood_bela: null, mood_sissi: null, mood_lola: null,
      note_own: '', note_health: '',
      health_papa: null, health_mama: null, health_bela: null, health_lola: null
    };

    // --- INITIALISIERUNG ---
    window.onload = () => {
      initTheme();
      loadStorage();
      renderMoodGrids();
      renderHealthRows();
      jumpToToday(); // Setzt Wochenansicht auf aktuelle Woche
    };

    function initTheme() {
      const toggle = document.getElementById('theme-toggle');
      const icon = document.getElementById('theme-icon');
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
        icon.classList.replace('fa-moon', 'fa-sun');
      }

      toggle.onclick = () => {
        const html = document.documentElement;
        html.classList.toggle('dark');
        const isDark = html.classList.contains('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        icon.className = isDark ? 'fa-solid fa-sun text-sm' : 'fa-solid fa-moon text-sm';
      };
    }

    function loadStorage() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try { appData = JSON.parse(raw); } catch(e) { appData = {}; }
      }
    }

    function saveStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    // --- DATUM-HILFSFUNKTIONEN ---
    // Gibt das Datum als YYYY-MM-DD zurück (lokale Zeitzone)
    function formatDateStr(date) {
      const d = new Date(date);
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }
    
    // Gibt den Montag der Woche zurück, in der das übergebene Datum liegt
    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    // --- VIEW SWITCHER ---
    function setMainView(view) {
      const vWeek = document.getElementById('view-week');
      const vEntry = document.getElementById('view-entry');
      const fab = document.getElementById('fab-container');

      if (view === 'week') {
        vWeek.classList.remove('hidden');
        vEntry.classList.add('hidden');
        fab.classList.remove('translate-y-32'); // Show FAB
      } else {
        vWeek.classList.add('hidden');
        vEntry.classList.remove('hidden');
        fab.classList.add('translate-y-32'); // Hide FAB
      }
    }

    // --- WOCHENANSICHT ---
    function jumpToToday() {
      viewWeekStartDate = getMonday(new Date());
      renderWeek();
    }

    function changeWeek(offset) {
      viewWeekStartDate.setDate(viewWeekStartDate.getDate() + (offset * 7));
      renderWeek();
    }

    function renderWeek() {
      const list = document.getElementById('week-list');
      list.innerHTML = '';
      
      const mon = new Date(viewWeekStartDate);
      const sun = new Date(viewWeekStartDate);
      sun.setDate(sun.getDate() + 6);

      // Label Header (z.B. 11. Nov - 17. Nov 2024)
      const options = { day: 'numeric', month: 'short' };
      const strMon = mon.toLocaleDateString('de-DE', options);
      const strSun = sun.toLocaleDateString('de-DE', options);
      const year = sun.getFullYear(); // Jahr vom Sonntag nehmen
      document.getElementById('week-range-label').innerText = `${strMon} - ${strSun} ${year}`;

      // Show/Hide "Zur aktuellen Woche" Button
      const currentMondayStr = formatDateStr(getMonday(new Date()));
      const viewMondayStr = formatDateStr(mon);
      document.getElementById('btn-jump-today').style.display = (currentMondayStr === viewMondayStr) ? 'none' : 'block';

      // 7 Karten generieren (Montag bis Sonntag)
      const dayNames = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
      const todayStr = formatDateStr(new Date());

      for (let i = 0; i < 7; i++) {
        const loopDate = new Date(mon);
        loopDate.setDate(mon.getDate() + i);
        const dStr = formatDateStr(loopDate);
        const entry = appData[dStr];
        const isToday = dStr === todayStr;

        const dateDisplay = `${dayNames[i]}, ${String(loopDate.getDate()).padStart(2,'0')}.${String(loopDate.getMonth()+1).padStart(2,'0')}.`;

        // Emojis
        const getE = (moodId) => {
          if (!moodId) return '<span class="opacity-20 text-slate-300">-</span>';
          const f = MOODS.find(x => x.id === moodId);
          return f ? f.emoji : '-';
        };

        const ownE = entry && entry.mood_own ? getE(entry.mood_own) : '<span class="opacity-20 text-slate-300 text-2xl">➕</span>';
        
        let kidsHtml = '';
        if (entry && (entry.mood_bela || entry.mood_sissi || entry.mood_lola)) {
          kidsHtml = `
            <div class="flex items-center gap-3 text-sm bg-slate-50 dark:bg-slate-800/50 py-1.5 px-3 rounded-xl border border-slate-100 dark:border-slate-800">
              <span><span class="font-bold text-blue-500 mr-1 text-[10px]">B</span>${getE(entry.mood_bela)}</span>
              <span><span class="font-bold text-pink-500 mr-1 text-[10px]">S</span>${getE(entry.mood_sissi)}</span>
              <span><span class="font-bold text-purple-500 mr-1 text-[10px]">L</span>${getE(entry.mood_lola)}</span>
            </div>
          `;
        } else if (entry) {
          kidsHtml = `<span class="text-[10px] text-slate-400">Keine Daten</span>`;
        }

        const borderClass = isToday ? 'border-brand-400 bg-brand-50/30 dark:bg-brand-900/10' : 'border-slate-200/80 dark:border-slate-700/80 bg-white/90 dark:bg-slate-800/90';
        const textDateClass = isToday ? 'text-brand-600 dark:text-brand-400 font-extrabold' : 'text-slate-600 dark:text-slate-300 font-bold';

        const card = document.createElement('div');
        card.className = `flex items-center justify-between p-4 rounded-2xl border ${borderClass} shadow-sm btn-press cursor-pointer backdrop-blur-md`;
        card.onclick = () => openDayModal(dStr);

        card.innerHTML = `
          <!-- Links: Datum -->
          <div class="w-1/4 min-w-[70px]">
            <span class="text-xs ${textDateClass}">${dateDisplay}</span>
          </div>
          
          <!-- Mitte: Own Mood -->
          <div class="w-1/4 flex justify-center">
            <span class="text-3xl sm:text-4xl filter drop-shadow-sm transition-transform">${ownE}</span>
          </div>
          
          <!-- Rechts: Kids -->
          <div class="w-1/2 flex justify-end">
            ${kidsHtml}
          </div>
        `;
        list.appendChild(card);
      }
    }

    // --- EINTRAGEN FLOW ---
    function startEntryForToday() {
      startEntry(formatDateStr(new Date()));
    }

    function startEntry(dateStr) {
      editingDateStr = dateStr;
      document.getElementById('entry-date').value = dateStr;
      
      const data = appData[dateStr] || {};
      currentEntry = {
        mood_own: data.mood_own || null, mood_bela: data.mood_bela || null,
        mood_sissi: data.mood_sissi || null, mood_lola: data.mood_lola || null,
        note_own: data.note_own || '', note_health: data.note_health || '',
        health_papa: data.health_papa || null, health_mama: data.health_mama || null,
        health_bela: data.health_bela || null, health_lola: data.health_lola || null
      };

      document.getElementById('note-own').value = currentEntry.note_own;
      document.getElementById('note-health').value = currentEntry.note_health;
      
      ['own', 'bela', 'sissi', 'lola'].forEach(k => updateMoodUI(k, currentEntry[`mood_${k}`]));
      PERSONS_HEALTH.forEach(p => updateHealthUI(p.id, currentEntry[`health_${p.id}`]));

      currentStep = 1;
      updateStepperUI();
      setMainView('entry');
    }

    function switchEntryDate(newDateStr) {
      if(newDateStr) {
        // Save current notes temporarily just in case, though switching date resets flow
        startEntry(newDateStr);
      }
    }

    function cancelEntry() {
      setMainView('week');
    }

    // -- Stimmungs Grid --
    function renderMoodGrids() {
      const keys = ['own', 'bela', 'sissi', 'lola'];
      keys.forEach(key => {
        const container = document.getElementById(`mood-grid-${key}`);
        container.innerHTML = MOODS.map(m => `
          <button onclick="setMood('${key}', '${m.id}')" id="btn-mood-${key}-${m.id}" class="aspect-square flex flex-col items-center justify-center gap-1 p-1 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 btn-press">
            <span class="text-2xl sm:text-3xl filter drop-shadow-sm">${m.emoji}</span>
            <span class="text-[9px] font-bold leading-tight px-1 break-words w-full text-center">${m.label}</span>
          </button>
        `).join('');
      });
    }

    function setMood(personKey, moodId) {
      currentEntry[`mood_${personKey}`] = moodId;
      updateMoodUI(personKey, moodId);
      // Auto-advance if not last step and not own mood (where they might want to type notes)
      if (personKey !== 'own' && currentStep < 5) {
        setTimeout(() => navStep(1), 300);
      }
    }

    function updateMoodUI(personKey, moodId) {
      MOODS.forEach(m => {
        const btn = document.getElementById(`btn-mood-${personKey}-${m.id}`);
        if(!btn) return;
        if (m.id === moodId) {
          let c = personKey === 'bela' ? 'border-blue-500 bg-blue-50 dark:bg-blue-900/30' : 
                  personKey === 'sissi' ? 'border-pink-500 bg-pink-50 dark:bg-pink-900/30' : 
                  personKey === 'lola' ? 'border-purple-500 bg-purple-50 dark:bg-purple-900/30' : 
                  'border-brand-500 bg-brand-50 dark:bg-brand-900/30';
          btn.className = `aspect-square flex flex-col items-center justify-center gap-1 p-1 rounded-2xl border-2 ${c} btn-press transform scale-95 shadow-sm`;
        } else {
          btn.className = "aspect-square flex flex-col items-center justify-center gap-1 p-1 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-500 btn-press";
        }
      });
    }

    // -- Gesundheits Zeilen --
    function renderHealthRows() {
      const container = document.getElementById('health-rows');
      container.innerHTML = PERSONS_HEALTH.map(p => `
        <div class="bg-white dark:bg-slate-800/80 p-2.5 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm">
          <div class="mb-2 pl-1">
            <span class="text-xs font-bold text-slate-600 dark:text-slate-300">${p.label}</span>
          </div>
          <div class="flex gap-2">
            ${HEALTH_STATES.map(h => `
              <button onclick="setHealth('${p.id}', '${h.id}')" id="btn-health-${p.id}-${h.id}" class="flex-1 py-2 text-[10px] font-bold rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 text-slate-500 btn-press uppercase tracking-wider">
                ${h.label}
              </button>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function setHealth(personId, healthId) {
      currentEntry[`health_${personId}`] = healthId;
      updateHealthUI(personId, healthId);
    }

    function updateHealthUI(personId, healthId) {
      HEALTH_STATES.forEach(h => {
        const btn = document.getElementById(`btn-health-${personId}-${h.id}`);
        if(!btn) return;
        if (h.id === healthId) {
          btn.className = `flex-1 py-2 text-[10px] font-bold rounded-xl border-2 ${h.color} btn-press uppercase tracking-wider`;
        } else {
          btn.className = `flex-1 py-2 text-[10px] font-bold rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 text-slate-500 btn-press uppercase tracking-wider`;
        }
      });
    }

    // -- Stepper Logik --
    function updateStepperUI() {
      for(let i=1; i<=5; i++) {
        const s = document.getElementById(`step-${i}`);
        s.classList.add('opacity-0', 'pointer-events-none');
        s.classList.remove('opacity-100', 'pointer-events-auto', 'z-10');
      }
      const current = document.getElementById(`step-${currentStep}`);
      current.classList.remove('opacity-0', 'pointer-events-none');
      current.classList.add('opacity-100', 'pointer-events-auto', 'z-10');

      const titles = ["Allgemein", "Bela", "Sissi", "Lola", "Gesundheit"];
      document.getElementById('step-label').innerText = `Schritt ${currentStep}/5`;
      document.getElementById('step-title-hint').innerText = titles[currentStep-1];
      document.getElementById('step-progress-bar').style.width = `${(currentStep/5)*100}%`;

      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      const btnSkip = document.getElementById('btn-skip');
      const btnFinish = document.getElementById('btn-finish');

      if (currentStep === 1) {
        btnPrev.classList.add('opacity-0', 'pointer-events-none');
        btnSkip.classList.add('hidden'); // Kein Skip in Schritt 1
      } else {
        btnPrev.classList.remove('opacity-0', 'pointer-events-none');
        btnSkip.classList.remove('hidden');
      }

      if (currentStep === 5) {
        btnNext.classList.add('hidden'); 
        btnSkip.classList.add('hidden');
        btnFinish.classList.remove('hidden');
      } else {
        btnNext.classList.remove('hidden'); 
        btnFinish.classList.add('hidden');
      }
    }

    function navStep(dir) {
      currentEntry.note_own = document.getElementById('note-own').value;
      currentEntry.note_health = document.getElementById('note-health').value;
      currentStep = Math.max(1, Math.min(5, currentStep + dir));
      updateStepperUI();
    }

    function skipStep() { navStep(1); }

    function saveAndFinish() {
      currentEntry.note_own = document.getElementById('note-own').value;
      currentEntry.note_health = document.getElementById('note-health').value;

      appData[editingDateStr] = { ...currentEntry };
      saveStorage();

      showToast("Eintrag gespeichert!");
      renderWeek();
      setMainView('week');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      toast.classList.remove('-translate-y-10', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-10', 'opacity-0');
      }, 2500);
    }

    // --- MODAL (Tagesansicht Detail) ---
    function openDayModal(dStr) {
      const entry = appData[dStr];
      const modal = document.getElementById('day-modal');
      const content = document.getElementById('day-modal-content');
      
      const dateObj = new Date(dStr);
      const fDate = dateObj.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

      if (!entry || Object.keys(entry).length === 0) {
        content.innerHTML = `
          <div class="text-center py-6">
            <div class="w-14 h-14 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-400 flex items-center justify-center mx-auto mb-4 text-2xl">
              <i class="fa-regular fa-calendar-xmark"></i>
            </div>
            <h3 class="font-extrabold text-lg mb-2">${fDate}</h3>
            <p class="text-sm text-slate-500 mb-6">Für diesen Tag gibt es noch keinen Eintrag.</p>
            <button onclick="startEntryAndCloseModal('${dStr}')" class="w-full py-3.5 bg-brand-500 text-white rounded-2xl font-bold btn-press shadow-lg shadow-brand-500/30 text-sm">
              Jetzt eintragen
            </button>
            <button onclick="closeModal()" class="w-full py-3 mt-2 text-slate-500 font-bold btn-press text-sm">Abbrechen</button>
          </div>
        `;
      } else {
        const getMood = (id) => MOODS.find(x => x.id === id) || {emoji: '❓', label:'-'};
        const mO = getMood(entry.mood_own);
        const mB = getMood(entry.mood_bela);
        const mS = getMood(entry.mood_sissi);
        const mL = getMood(entry.mood_lola);

        const getH = (id) => HEALTH_STATES.find(x => x.id === entry[`health_${id}`])?.label || '-';

        content.innerHTML = `
          <div class="flex justify-between items-center mb-6">
            <div>
              <p class="text-[10px] font-bold text-brand-600 dark:text-brand-400 uppercase tracking-wide">Tagesbericht</p>
              <h3 class="font-extrabold text-lg">${fDate}</h3>
            </div>
            <button onclick="closeModal()" class="w-8 h-8 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-slate-500 btn-press">
              <i class="fa-solid fa-xmark text-sm"></i>
            </button>
          </div>

          <div class="space-y-4">
            
            <!-- Stimmungen -->
            <div>
              <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Stimmungen</h4>
              <div class="grid grid-cols-2 gap-2">
                <div class="bg-slate-50 dark:bg-slate-800 p-3 rounded-2xl border border-slate-100 dark:border-slate-700 flex items-center gap-3">
                  <span class="text-2xl">${mO.emoji}</span>
                  <div><span class="block text-[9px] text-slate-400 font-bold uppercase">Ich / Papa</span><span class="text-xs font-bold">${mO.label}</span></div>
                </div>
                <div class="bg-blue-50 dark:bg-blue-900/20 p-3 rounded-2xl border border-blue-100 dark:border-blue-800/50 flex items-center gap-3">
                  <span class="text-2xl">${mB.emoji}</span>
                  <div><span class="block text-[9px] text-blue-500 font-bold uppercase">Bela</span><span class="text-xs font-bold">${mB.label}</span></div>
                </div>
                <div class="bg-pink-50 dark:bg-pink-900/20 p-3 rounded-2xl border border-pink-100 dark:border-pink-800/50 flex items-center gap-3">
                  <span class="text-2xl">${mS.emoji}</span>
                  <div><span class="block text-[9px] text-pink-500 font-bold uppercase">Sissi</span><span class="text-xs font-bold">${mS.label}</span></div>
                </div>
                <div class="bg-purple-50 dark:bg-purple-900/20 p-3 rounded-2xl border border-purple-100 dark:border-purple-800/50 flex items-center gap-3">
                  <span class="text-2xl">${mL.emoji}</span>
                  <div><span class="block text-[9px] text-purple-500 font-bold uppercase">Lola</span><span class="text-xs font-bold">${mL.label}</span></div>
                </div>
              </div>
            </div>

            <!-- Notizen Tag -->
            ${entry.note_own ? `
            <div>
              <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Tagesnotiz</h4>
              <div class="bg-amber-50 dark:bg-amber-900/20 p-4 rounded-2xl text-sm border border-amber-100 dark:border-amber-800/50 whitespace-pre-line leading-relaxed">
                ${entry.note_own}
              </div>
            </div>` : ''}

            <!-- Gesundheit -->
            <div>
              <h4 class="text-[10px] font-bold text-emerald-500 uppercase tracking-wider mb-2">Gesundheit</h4>
              <div class="bg-emerald-50/50 dark:bg-emerald-900/10 rounded-2xl p-3 border border-emerald-100 dark:border-emerald-800/30">
                <div class="grid grid-cols-2 gap-y-3 gap-x-2 text-xs">
                  <div class="flex flex-col"><span class="text-[10px] text-slate-400 font-bold">Papa</span> <span class="font-bold text-slate-700 dark:text-slate-200">${getH('papa')}</span></div>
                  <div class="flex flex-col"><span class="text-[10px] text-slate-400 font-bold">Mama</span> <span class="font-bold text-slate-700 dark:text-slate-200">${getH('mama')}</span></div>
                  <div class="flex flex-col"><span class="text-[10px] text-slate-400 font-bold">Bela</span> <span class="font-bold text-slate-700 dark:text-slate-200">${getH('bela')}</span></div>
                  <div class="flex flex-col"><span class="text-[10px] text-slate-400 font-bold">Lola</span> <span class="font-bold text-slate-700 dark:text-slate-200">${getH('lola')}</span></div>
                </div>
                ${entry.note_health ? `
                <div class="mt-3 pt-3 border-t border-emerald-200/50 dark:border-emerald-800/50 text-xs text-slate-600 dark:text-slate-300 whitespace-pre-line">
                  <span class="font-bold block text-[10px] text-slate-400 uppercase mb-1">Notiz</span> ${entry.note_health}
                </div>` : ''}
              </div>
            </div>

            <!-- Action -->
            <div class="pt-4">
               <button onclick="startEntryAndCloseModal('${dStr}')" class="w-full py-3.5 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-2xl font-bold btn-press flex justify-center items-center gap-2 text-sm shadow-sm">
                 <i class="fa-solid fa-pen text-xs"></i> Eintrag bearbeiten
               </button>
            </div>

          </div>
        `;
      }
      
      modal.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => { content.classList.remove('translate-y-full'); }, 10);
    }

    function closeModal() {
      const modal = document.getElementById('day-modal');
      const content = document.getElementById('day-modal-content');
      content.classList.add('translate-y-full');
      setTimeout(() => { modal.classList.add('opacity-0', 'pointer-events-none'); }, 300);
    }

    function startEntryAndCloseModal(dStr) {
      closeModal();
      setTimeout(() => {
        startEntry(dStr);
      }, 300);
    }
  </script>
</body>
</html>
